<body>
  <header>
    <h1>IDM241 • Final-Build </h1>
    <h2>Microinteraction: Control Center Buttons</h2>
    <p>Riley Mitchell •  IDM241</p>
  </header>

  <main>
    
  <!-- =============================== -->
  <!--  CONTROL CENTER -->
  <!-- =============================== -->

  <article class="spec-col" id="controlcenter-spec">

    <div class="cc-simple">
      <!-- small circle → pill trigger -->
      <button id="cc-trigger"
              class="cc-trigger"
              aria-expanded="false"
              aria-label="Open control center">
        <img src="images/control center icon.svg"
            alt=""
            class="cc-trigger__icon">
      </button>

      <!-- panel that drops down and holds the 4 buttons -->
      <div class="cc-panel" aria-hidden="true">
        <div class="cc-slot cc-slot--ringer"></div>
        <div class="cc-slot cc-slot--appearance"></div>
        <div class="cc-slot cc-slot--lowpower"></div>
        <div class="cc-slot cc-slot--orientation"></div>
      </div>
    </div>
  </article>  









    
  </main>
  <script src="tester.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IDM241 Final-Build</title>
  <meta name="description" content="IDM241 assignment page" />
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <header>
    <h1>IDM241 • Final-Build</h1>
    <h2>Microinteraction: Control Center Buttons</h2>
    <p>Riley Mitchell • IDM241</p>
  </header>

  <main>
    <!-- =============================== -->
    <!--  CONTROL CENTER -->
    <!-- =============================== -->
    <section class="spec-grid">
      <article class="spec-col" id="controlcenter-spec">
        <header class="spec-col__title">
          <h2>CONTROL CENTER</h2>
        </header>

        <div class="cc-simple">
          <button
            id="cc-trigger"
            class="cc-trigger"
            aria-expanded="false"
            aria-label="Open control center">
            <img
              src="images/control center icon.svg"
              alt=""
              class="cc-trigger__icon">
          </button>

          <div class="cc-panel" aria-hidden="true">
            <button
              id="ringer"
              class="cc-slot ringer"
              aria-pressed="false"
              aria-label="Toggle ringer">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  class="bell"
                  d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Zm6-6V11a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2Z" />
                <path class="slash-back"  d="M1 4 L23 20" pathLength="100" />
                <path class="slash-front" d="M1 4 L23 20" pathLength="100" />
              </svg>
            </button>

            <button
              id="appearance"
              class="cc-slot toggle-btn appearance"
              aria-pressed="false"
              aria-label="Toggle dark mode">
              <span class="icon-shell">
                <span class="sun-icon"></span>
                <span class="moon-icon"></span>
              </span>
            </button>

            <button
              id="low-power"
              class="cc-slot lp-btn"
              aria-pressed="false"
              aria-label="Toggle Low Power Mode">
              <span class="lp-inner">
                <span class="lp-battery">
                  <span class="lp-body"></span>
                  <span class="lp-fill"></span>
                  <span class="lp-tip"></span>
                </span>
              </span>
            </button>

            <button
              id="orientation"
              class="cc-slot orientation-btn"
              aria-pressed="false"
              aria-label="Toggle Orientation Lock">
              <div class="orientation-inner">
                <div class="phone">
                  <div class="phone-screen"></div>
                  <div class="lock-icon">
                    <img
                      src="images/locked.svg"
                      alt=""
                      class="lock-svg lock-svg--locked">
                    <img
                      src="images/unlocked.svg"
                      alt=""
                      class="lock-svg lock-svg--unlocked">
                  </div>
                </div>
              </div>
            </button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script src="tester.js"></script>
</body>
</html>

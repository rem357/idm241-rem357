<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IDM241 Beta-Build</title>
  <meta name="description" content="IDM241 assignment page" />
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <header>
    <h1>IDM241 • Beta-Build </h1>
    <h2>Microinteraction: Control Center Buttons</h2>
    <p>Riley Mitchell •  IDM241</p>
  </header>

  <main>

      <!-- =============================== -->
      <!-- CONTROL CENTER GROUP BUTTON -->
      <!-- =============================== -->
      <article class="spec-col" id="controlcenter-spec">

        <header class="spec-col__title"><h2>CONTROL CENTER</h2></header>

        <div class="cc-wrapper">
          <button id="cc-main"
                  class="cc-btn"
                  aria-expanded="false"
                  aria-label="Open control center">
            <span class="cc-dot"></span>
            <span class="cc-dot"></span>
            <span class="cc-dot"></span>
          </button>

          <div class="cc-panel" aria-hidden="true">
            <button class="mini-btn mini-ringer" aria-hidden="true"></button>
            <button class="mini-btn mini-appearance" aria-hidden="true"></button>
            <button class="mini-btn mini-lowpower" aria-hidden="true"></button>
            <button class="mini-btn mini-orientation" aria-hidden="true"></button>
          </div>
        </div>

      </article>

    <section class="spec-grid">

      <!-- =============================== -->
      <!--  RINGER / SILENT -->
      <!-- =============================== -->
      <article class="spec-col" id="ringer-spec">
        <header class="spec-col__title"><h2>RINGER / SILENT</h2></header>

        <button id="ringer" class="ringer" aria-pressed="false" aria-label="Toggle ringer">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="bell"
            d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Zm6-6V11a6 6 0 1 0-12 0v5l-2 2v1h16v-1l-2-2Z" />
            <path class="slash-back"  d="M1 4 L23 20" pathLength="100" />
            <path class="slash-front" d="M1 4 L23 20" pathLength="100" />
        </svg>
        </button>

      </article>

      <!-- =============================== -->
      <!-- LIGHT / DARK MODE -->
      <!-- =============================== -->
      <article class="spec-col" id="appearance-spec">  <!-- APPEARANCE: sun → crescent -->
        <header class="spec-col__title"><h2>LIGHT / DARK MODE</h2></header>

        <button id="appearance"
                class="toggle-btn appearance"
                aria-pressed="false"
                aria-label="Toggle dark mode">
          <span class="icon-shell">
            <span class="sun-icon"></span>
            <span class="moon-icon"></span>
          </span>
        </button>
    </article>


      <!-- =============================== -->
      <!-- LOW POWER MODE -->
      <!-- =============================== -->
      <article class="spec-col" id="lowpower-spec">

        <header class="spec-col__title"><h2>LOW POWER MODE</h2></header>

        <button id="low-power"
                class="lp-btn"
                aria-pressed="false"
                aria-label="Toggle Low Power Mode">
          <span class="lp-inner">
            <span class="lp-battery">
              <span class="lp-body"></span>
              <span class="lp-fill"></span>
              <span class="lp-tip"></span>
            </span>
          </span>
        </button>

      </article>

      <!-- =============================== -->
      <!-- SCREEN ORIENTATION LOCK -->
      <!-- =============================== -->
      <article class="spec-col" id="orientation-spec">

        <header class="spec-col__title"><h2>SCREEN ORIENTATION LOCK</h2></header>

        <button id="orientation"
                class="orientation-btn"
                aria-pressed="false"
                aria-label="Toggle Orientation Lock">
          <div class="orientation-inner">
            <div class="phone">
              <div class="phone-screen"></div>
            </div>

            <!-- NEW: SVG lock icons -->
            <div class="lock-icon">
              <img src="locked.svg"
                  alt=""
                  class="lock-svg lock-svg--locked">
              <img src="unlocked.svg"
                  alt=""
                  class="lock-svg lock-svg--unlocked">
            </div>
          </div>
        </button>

      </article>


    </section>

    <br><br>

  </main>
  <script src="tester.js"></script>
</body>
</html>
